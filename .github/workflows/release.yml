name: 버전 릴리스

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 릴리스 버전 확인
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      should_release: ${{ steps.metadata.outputs.should_release }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 버전과 기존 태그 확인
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess
          import tomllib

          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          manifest_version = json.loads(
              Path("plugins/codex-compressor/.codex-plugin/plugin.json").read_text(
                  encoding="utf-8"
              )
          )["version"]
          if project_version != manifest_version:
              raise SystemExit(
                  "릴리스 버전이 일치하지 않습니다: "
                  f"pyproject.toml={project_version}, "
                  f"플러그인 매니페스트={manifest_version}"
              )

          tag = f"v{project_version}"
          remote = subprocess.run(
              [
                  "git",
                  "ls-remote",
                  "--exit-code",
                  "--tags",
                  "origin",
                  f"refs/tags/{tag}",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if remote.returncode == 0:
              should_release = "false"
          elif remote.returncode == 2:
              should_release = "true"
          else:
              raise SystemExit(
                  remote.stderr.strip() or f"원격 태그 조회 실패: {remote.returncode}"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\n")
              output.write(f"release_version={project_version}\n")
              output.write(f"should_release={should_release}\n")
          print(f"릴리스 태그: {tag}, 게시 필요: {should_release}")
          PY

  verify:
    name: 릴리스 소스 검증
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      CODEX_PLUGIN_VALIDATOR: ${{ github.workspace }}/.codex-validator-source/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: 공식 플러그인 검증기 가져오기
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          path: .codex-validator-source
          sparse-checkout: codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          sparse-checkout-cone-mode: false
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 검증기 의존성 설치
        run: python -m pip install pyyaml
      - name: 단위·플러그인 계약 테스트
        run: python -m unittest discover -s tests -v
      - name: 공식 플러그인 검증기 실행
        run: python "$CODEX_PLUGIN_VALIDATOR" plugins/codex-compressor
      - name: 플러그인 런타임 동기화 확인
        run: python tools/sync_plugin_runtime.py --check

  release:
    name: 릴리스 보관 및 게시
    needs:
      - prepare
      - verify
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 배포물 만들기
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p dist/release dist/plugin
          python - "$version" <<'PY'
          from pathlib import Path
          import sys
          import tarfile
          from zipfile import ZIP_DEFLATED, ZipFile

          version = sys.argv[1]
          root = Path.cwd()
          excluded = {".git", ".github", ".codex-validator-source", "dist", "build", ".venv"}

          def source_files(base: Path) -> list[Path]:
              return [
                  path
                  for path in base.rglob("*")
                  if path.is_file()
                  and "__pycache__" not in path.parts
                  and path.suffix != ".pyc"
              ]

          files = [
              path
              for path in source_files(root)
              if not excluded.intersection(path.relative_to(root).parts)
          ]
          prefix = f"codex-compressor-{version}"
          with ZipFile(root / "dist" / "release" / f"{prefix}.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  archive.write(path, Path(prefix) / path.relative_to(root))
          with tarfile.open(root / "dist" / "release" / f"{prefix}.tar.gz", "w:gz") as archive:
              for path in sorted(files):
                  archive.add(path, Path(prefix) / path.relative_to(root))

          plugin_root = root / "plugins" / "codex-compressor"
          plugin_files = source_files(plugin_root)
          license_files = [root / "LICENSE", root / "NOTICE"]
          plugin_archive = root / "dist" / "plugin" / f"codex-compressor-plugin-{version}.zip"
          with ZipFile(plugin_archive, "w", ZIP_DEFLATED) as archive:
              for path in sorted(plugin_files):
                  archive.write(path, path.relative_to(plugin_root))
              for path in license_files:
                  archive.write(path, path.name)

          marketplace_files = [
              root / ".agents" / "plugins" / "marketplace.json",
              root / ".codex-plugin" / "marketplace.json",
              root / "LICENSE",
              root / "NOTICE",
          ]
          marketplace_archive = (
              root / "dist" / "plugin" / f"codex-compressor-marketplace-{version}.zip"
          )
          with ZipFile(marketplace_archive, "w", ZIP_DEFLATED) as archive:
              for path in marketplace_files:
                  archive.write(path, path.relative_to(root))
              for path in sorted(plugin_files):
                  archive.write(path, path.relative_to(root))
          PY
      - name: 릴리스 본문 만들기
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: python tools/release_notes.py "$RELEASE_VERSION" dist/RELEASE_NOTES.md
      - name: SHA-256 체크섬 만들기
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find release plugin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: 최신 main 커밋 확인
        id: head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$remote_head" ]]; then
            echo "원격 main 커밋을 확인하지 못했습니다." >&2
            exit 1
          fi
          if [[ "$remote_head" == "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "더 최신 main 실행이 있으므로 이 릴리스 게시를 건너뜁니다."
          fi
      - name: GitHub 릴리스 게시
        if: steps.head.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ${{ needs.prepare.outputs.release_tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/release/*
            dist/plugin/*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
