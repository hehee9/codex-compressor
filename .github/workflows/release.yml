name: 태그 릴리스

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: 태그 소스 검증
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      CODEX_PLUGIN_VALIDATOR: ${{ github.workspace }}/.codex-validator-source/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: 공식 플러그인 검증기 가져오기
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          path: .codex-validator-source
          sparse-checkout: codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          sparse-checkout-cone-mode: false
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 검증기 의존성 설치
        run: python -m pip install pyyaml
      - name: 단위·플러그인 계약 테스트
        run: python -m unittest discover -s tests -v
      - name: 공식 플러그인 검증기 실행
        run: python "$CODEX_PLUGIN_VALIDATOR" plugins/codex-compressor
      - name: 플러그인 런타임 동기화 확인
        run: python tools/sync_plugin_runtime.py --check
      - name: 태그·패키지 버전 일치 확인
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import json
          import sys
          import tomllib

          tag = sys.argv[1]
          if not tag.startswith("v"):
              raise SystemExit(f"v 접두사가 없는 릴리스 태그입니다: {tag}")
          tag_version = tag[1:]
          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          manifest_version = json.loads(
              Path("plugins/codex-compressor/.codex-plugin/plugin.json").read_text(
                  encoding="utf-8"
              )
          )["version"]
          versions = {
              "태그": tag_version,
              "pyproject.toml": project_version,
              "플러그인 매니페스트": manifest_version,
          }
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{name}={value}" for name, value in versions.items())
              raise SystemExit(f"릴리스 버전이 일치하지 않습니다: {details}")
          print(f"릴리스 버전 확인: {tag_version}")
          PY

  release:
    name: 태그 릴리스 보관 및 게시
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 배포물 만들기
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist/release dist/plugin
          python - "$version" <<'PY'
          from pathlib import Path
          import sys
          import tarfile
          from zipfile import ZIP_DEFLATED, ZipFile

          version = sys.argv[1]
          root = Path.cwd()
          excluded = {".git", ".github", ".codex-validator-source", "dist", "build", ".venv"}

          def source_files(base: Path) -> list[Path]:
              return [
                  path
                  for path in base.rglob("*")
                  if path.is_file()
                  and "__pycache__" not in path.parts
                  and path.suffix != ".pyc"
              ]

          files = [
              path
              for path in source_files(root)
              if not excluded.intersection(path.relative_to(root).parts)
          ]
          prefix = f"codex-compressor-{version}"
          with ZipFile(root / "dist" / "release" / f"{prefix}.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  archive.write(path, Path(prefix) / path.relative_to(root))
          with tarfile.open(root / "dist" / "release" / f"{prefix}.tar.gz", "w:gz") as archive:
              for path in sorted(files):
                  archive.add(path, Path(prefix) / path.relative_to(root))

          plugin_root = root / "plugins" / "codex-compressor"
          plugin_files = source_files(plugin_root)
          license_files = [root / "LICENSE", root / "NOTICE"]
          plugin_archive = root / "dist" / "plugin" / f"codex-compressor-plugin-{version}.zip"
          with ZipFile(plugin_archive, "w", ZIP_DEFLATED) as archive:
              for path in sorted(plugin_files):
                  archive.write(path, path.relative_to(plugin_root))
              for path in license_files:
                  archive.write(path, path.name)

          marketplace_files = [
              root / ".agents" / "plugins" / "marketplace.json",
              root / ".codex-plugin" / "marketplace.json",
              root / "LICENSE",
              root / "NOTICE",
          ]
          marketplace_archive = (
              root / "dist" / "plugin" / f"codex-compressor-marketplace-{version}.zip"
          )
          with ZipFile(marketplace_archive, "w", ZIP_DEFLATED) as archive:
              for path in marketplace_files:
                  archive.write(path, path.relative_to(root))
              for path in sorted(plugin_files):
                  archive.write(path, path.relative_to(root))
          PY
      - name: SHA-256 체크섬 만들기
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find release plugin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: GitHub 릴리스 게시
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
            dist/plugin/*
            dist/SHA256SUMS
          generate_release_notes: true
