name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: 단위·플러그인 계약 테스트
        run: python -m unittest discover -s tests -v
      - name: 플러그인 계약 검증
        run: python -m unittest discover -s tests -p test_plugin_contract.py -v
      - name: 플러그인 런타임 동기화 확인
        run: python tools/sync_plugin_runtime.py --check
      - name: 설치 스모크 테스트
        run: |
          python -m codex_compressor --help
          python -c "import codex_compressor; print(codex_compressor.__name__)"
    env:
      PYTHONPATH: ${{ github.workspace }}/src
